packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    # Retain the security fixes in Auth.js 0.41.3 for the Atlassian integration.
    'auth-astro@4.2.0>@auth/core': 0.41.3

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.150'
  - '@astrojs/node@11.1.14'
  - '@astrojs/runtime@0.1.2'
  - '@turbo/darwin-64@2.11.13'
  - '@turbo/darwin-arm64@2.11.13'
  - '@turbo/linux-64@2.11.13'
  - '@turbo/linux-arm64@2.11.13'
  - '@turbo/windows-64@2.11.13'
  - '@turbo/windows-arm64@2.11.13'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - ai@7.0.177
  - astro@7.4.13
  - lucide-react@1.76.0
  - turbo@2.11.13
  - vitest@5.1.1
  - sql.js@1.17.0

overrides:
  'dompurify@<3.4.17': 3.4.18
  'next@<15.5.24': 15.5.29
  'path-to-regexp@<6.3.0': 6.3.0
  'postcss@<8.5.23': 8.5.33
  'sharp@<0.35.4': 0.35.5
